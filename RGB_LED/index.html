<!DOCTYPE html>
<html lang='de'>
<head>
	<meta charset='UTF-8'>
	<meta name='viewport' content='width=device-width, initial-scale=1.0'>
	<title>WRZT · Lichtsteuerung</title>
	<style>
		body{background:#1a1a4a; color:#e0e0e0; text-align:center; font-family:sans-serif; padding:20px 10px; margin:0; min-height:100vh; box-sizing:border-box;}
		.card{margin-top: 20px; background:#2a2a6a; padding: 20px; border-radius:15px; display:inline-block; border: 1px solid #444; transition: box-shadow .15s; max-width:560px; width:100%; box-sizing:border-box;}
		.btn{padding:10px 16px; font-size:.95rem; margin:5px; border:none; border-radius:8px; cursor:pointer; font-weight:bold; transition: 0.3s;}

		.red{background:#cc3333; color:white;} .red:hover{background:#ff4444;}
		.green{background:#33cc33; color:white;} .green:hover{background:#44ff44;}
		.blue{background:#3333cc; color:white;} .blue:hover{background:#4444ff;}

		.yellow{background:#cccc33; color:white;} .yellow:hover{background:#ffff44;}
		.magenta{background:#cc33cc; color:white;} .magenta:hover{background:#ff44ff;}
		.aqua{background:#33cccc; color:white;} .aqua:hover{background:#44ffff;}

		.orange{background:#cc7733; color:white;} .orange:hover{background:#ffaa44;}

		.white{background:#bbbbbb; color:white;} .white:hover{background:#dddddd;}
		.off{background:#555; color:white;}

		.fx{background:#3b3b8f; color:white; border:1px solid #6666cc;}
		.fx:hover{background:#5555bb;}
		.fx.active{box-shadow:0 0 14px 3px #8fa0ff; outline:2px solid #c3ccff;}
		.fx.candle{background:linear-gradient(135deg,#d9a520,#cc5500); border-color:#ffb347;}
		.fx.candle.active{box-shadow:0 0 14px 3px #ff9a2e; outline-color:#ffd27a;}

		h2{font-size:.8rem; letter-spacing:.15em; text-transform:uppercase; color:#9fa8ff; margin:22px 0 6px; border-top:1px solid #444; padding-top:14px;}
		.row{display:flex; align-items:center; justify-content:center; gap:12px; margin:8px 0; flex-wrap:wrap;}
		.row label{min-width:70px; text-align:right; font-size:.9rem;}
		.row .val{min-width:30px; text-align:left; font-family:monospace; color:#9fa8ff;}
		input[type=range]{flex:1; min-width:140px; max-width:260px; accent-color:#8fa0ff;}
		select{padding:8px 10px; border-radius:8px; background:#1a1a4a; color:#e0e0e0; border:1px solid #6666cc; font-size:.95rem;}

		#conn{display:inline-block; padding:4px 12px; border-radius:20px; font-family:monospace; font-size:.8rem; background:rgba(100,116,139,.25); color:#aab; border:1px solid #556;}
		#conn.online{background:rgba(34,197,94,.15); color:#33cc33; border-color:rgba(34,197,94,.5);}
		#conn.offline{background:rgba(239,68,68,.15); color:#ff6666; border-color:rgba(239,68,68,.5);}

		#preview{width:34px; height:34px; border-radius:50%; background:#222; border:2px solid #555; display:inline-block; vertical-align:middle; transition:background .1s, box-shadow .1s;}

		#status{margin-top:12px; min-height:1.4em; font-family:monospace; font-size:.9rem;}
		#status.ok{color:#33cc33;}
		#status.err{color:#ff6666;}
		#sleep-left{font-family:monospace; color:#ffd27a; min-width:70px; text-align:left;}
	</style>
</head>
<body>
	<div class='card' id='card'>
		<h1>WRZT - Lichtsteuerung.</h1>
		<div><span id='conn'>● Prüfe …</span> <span id='preview'></span></div>

		<h2>Farben</h2>
		<button class='btn red' onclick="setColor('red')">ROT</button>
		<button class='btn green' onclick="setColor('green')">GRÜN</button>
		<button class='btn blue' onclick="setColor('blue')">BLAU</button>
		<br>
		<button class='btn yellow' onclick="setColor('yellow')">YELLOW</button>
		<button class='btn magenta' onclick="setColor('magenta')">MAGENTA</button>
		<button class='btn aqua' onclick="setColor('aqua')">AQUA</button>
		<br>
		<button class='btn off' onclick="setColor('off')">LED AUS</button>
		<button class='btn white' onclick="setColor('white')">WHITE</button>
		<button class='btn orange' onclick="setColor('orange')">ORANGE</button>

		<h2>Effekte</h2>
		<button class='btn fx candle' data-fx='candle' onclick="toggleEffect('candle')">🕯 KERZE</button>
		<button class='btn fx' data-fx='rainbow' onclick="toggleEffect('rainbow')">🌈 REGENBOGEN</button>
		<button class='btn fx' data-fx='party' onclick="toggleEffect('party')">🎉 PARTY</button>
		<button class='btn fx' data-fx='police' onclick="toggleEffect('police')">🚨 POLIZEI</button>
		<button class='btn fx' data-fx='sunset' onclick="toggleEffect('sunset')">🌅 SONNENUNTERGANG</button>
		<div class='row'>
			<label>Tempo</label>
			<input type='range' id='speed' min='1' max='10' value='5'>
			<span class='val' id='speed-val'>5</span>
		</div>

		<h2>Einschlaf-Timer</h2>
		<div class='row'>
			<select id='sleep-sel'>
				<option value='0'>Aus</option>
				<option value='15'>15 Minuten</option>
				<option value='30'>30 Minuten</option>
				<option value='60'>60 Minuten</option>
				<option value='120'>120 Minuten</option>
			</select>
			<span id='sleep-left'></span>
		</div>

		<h2>Anzeige</h2>
		<button class='btn fx' id='full-btn' onclick="toggleFullscreen()">⛶ VOLLBILD</button>

		<div id='status'></div>
		<p><small>Zaminia System Status: Online</small></p>
	</div>

	<script>
		// ---------- Basis ----------
		const API_BASE = (window.location.protocol === 'http:' || window.location.protocol === 'https:')
			&& window.location.hostname !== 'localhost'
			&& !window.location.hostname.includes('github')
			? window.location.origin
			: 'http://esp32gpio.local';

		const $ = id => document.getElementById(id);
		const statusEl = $('status'), cardEl = $('card'), previewEl = $('preview'), connEl = $('conn');

		// Nur Farbnamen, die der ESP32 über /rgb?color=... schon kennt
		const SHOW = {
			red:'#dc2626', green:'#16a34a', blue:'#2563eb', yellow:'#e0b020',
			magenta:'#a21caf', aqua:'#0891b2', orange:'#ea580c', white:'#e2e8f0', off:'transparent'
		};

		let speed = 5;
		const rand = (a,b) => a + Math.random()*(b-a);
		const pick = arr => arr[Math.floor(Math.random()*arr.length)];
		const sleep = ms => new Promise(r => setTimeout(r, ms));
		const spd = () => speed / 5;   // 1 = normal, 2 = doppelt so schnell

		function showStatus(text, ok = true) {
			statusEl.className = ok ? 'ok' : 'err';
			statusEl.textContent = text;
		}

		// ---------- Verbindung ----------
		function setOnline(on) {
			connEl.textContent = on ? '● Online' : '● Offline';
			connEl.className = on ? 'online' : 'offline';
		}

		async function ping() {
			const ctrl = new AbortController();
			const t = setTimeout(() => ctrl.abort(), 3000);
			try {
				const r = await fetch(API_BASE + '/info', { signal: ctrl.signal });
				setOnline(r.ok);
			} catch { setOnline(false); }
			clearTimeout(t);
		}
		ping();
		setInterval(ping, 5000);

		// ---------- Senden (nur eine Anfrage gleichzeitig, immer die neueste Farbe) ----------
		let sending = false, pending = null;

		async function pump() {
			if (sending) return;
			sending = true;
			while (pending) {
				const color = pending; pending = null;
				try {
					const r = await fetch(API_BASE + '/rgb?color=' + color);
					if (!r.ok) throw new Error('HTTP ' + r.status);
					setOnline(true);
				} catch (e) {
					setOnline(false);
					showStatus('Fehler: ' + e.message, false);
				}
			}
			sending = false;
		}

		// Farbe anzeigen (Vorschau + Rand-Leuchten) und an den ESP32 senden
		function frame(color) {
			const c = SHOW[color] || 'transparent';
			previewEl.style.background = color === 'off' ? '#222' : c;
			previewEl.style.boxShadow = color === 'off' ? 'none' : `0 0 14px 4px ${c}`;
			cardEl.style.boxShadow = color === 'off' ? 'none' : `0 0 40px 8px ${c}`;
			pending = color;
			pump();
		}

		// ---------- Effekte ----------
		let token = 0;        // jeder neue Effekt / jede neue Farbe macht alte Läufe ungültig
		let currentFx = null;

		function stopEffect() {
			token++;
			currentFx = null;
			document.querySelectorAll('.fx[data-fx]').forEach(b => b.classList.remove('active'));
		}

		function setColor(name) {
			stopEffect();
			frame(name);
			showStatus('LED → ' + (name === 'off' ? 'AUS' : name.toUpperCase()));
		}

		$('speed').addEventListener('input', e => {
			speed = +e.target.value;
			$('speed-val').textContent = speed;
		});

		const EFFECTS = {
			// Kerze: zufällig Gelb / Orange, Orange etwas häufiger, gelegentlich längere Ruhe
			async candle(on) {
				let last = '';
				while (on()) {
					let c = Math.random() < 0.6 ? 'orange' : 'yellow';
					if (c === last && Math.random() < 0.5) c = c === 'orange' ? 'yellow' : 'orange';
					last = c;
					frame(c);
					await sleep((Math.random() < 0.15 ? rand(500, 900) : rand(150, 400)) / spd());
				}
			},
			async rainbow(on) {
				const seq = ['red', 'orange', 'yellow', 'green', 'aqua', 'blue', 'magenta'];
				let i = 0;
				while (on()) {
					frame(seq[i]);
					i = (i + 1) % seq.length;
					await sleep(700 / spd());
				}
			},
			async party(on) {
				const cols = ['red', 'green', 'blue', 'yellow', 'magenta', 'aqua', 'orange', 'white'];
				let last = '';
				while (on()) {
					let c; do { c = pick(cols); } while (c === last);
					last = c;
					frame(c);
					await sleep(rand(250, 550) / spd());
				}
			},
			async police(on) {
				while (on()) {
					for (const c of ['red','off','red','off','blue','off','blue','off']) {
						if (!on()) return;
						frame(c);
						await sleep((c === 'off' ? 90 : 200) / spd());
					}
				}
			},
			// Sonnenuntergang: Gelb → Orange → Rot → aus (je Stufe ca. 30 s bei Tempo 5)
			async sunset(on) {
				for (const c of ['yellow', 'orange', 'red', 'off']) {
					if (!on()) return;
					frame(c);
					if (c === 'off') break;
					const end = Date.now() + 30000 / spd();
					while (on() && Date.now() < end) await sleep(250);
				}
				if (on()) { stopEffect(); showStatus('Sonnenuntergang beendet'); }
			}
		};

		function toggleEffect(name) {
			if (currentFx === name) { stopEffect(); showStatus('Effekt beendet'); return; }
			stopEffect();
			currentFx = name;
			const my = token;
			document.querySelector(`.fx[data-fx="${name}"]`).classList.add('active');
			showStatus('Effekt: ' + name.toUpperCase());
			EFFECTS[name](() => token === my);
		}

		// ---------- Einschlaf-Timer ----------
		let sleepEnd = 0, sleepTimer = null;

		$('sleep-sel').addEventListener('change', e => {
			clearInterval(sleepTimer);
			const min = +e.target.value;
			if (!min) { $('sleep-left').textContent = ''; showStatus('Timer aus'); return; }
			sleepEnd = Date.now() + min * 60000;
			showStatus('LED geht in ' + min + ' Minuten aus');
			sleepTimer = setInterval(tickSleep, 1000);
			tickSleep();
		});

		function tickSleep() {
			const left = Math.max(0, sleepEnd - Date.now());
			const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
			$('sleep-left').textContent = `${m}:${String(s).padStart(2, '0')}`;
			if (left <= 0) {
				clearInterval(sleepTimer);
				$('sleep-left').textContent = '';
				$('sleep-sel').value = '0';
				stopEffect();
				frame('off');
				showStatus('Einschlaf-Timer: LED aus');
			}
		}

		// ---------- Vollbild ----------
		const fullBtn = $('full-btn');
		const root = document.documentElement;
		if (!(root.requestFullscreen || root.webkitRequestFullscreen)) fullBtn.style.display = 'none';  // z. B. iPhone-Safari

		function toggleFullscreen() {
			const active = document.fullscreenElement || document.webkitFullscreenElement;
			if (!active) {
				const p = (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
				if (p && p.catch) p.catch(e => showStatus('Vollbild nicht möglich: ' + e.message, false));
			} else {
				(document.exitFullscreen || document.webkitExitFullscreen).call(document);
			}
		}
		function updateFullBtn() {
			fullBtn.textContent = (document.fullscreenElement || document.webkitFullscreenElement) ? '✕ VOLLBILD AUS' : '⛶ VOLLBILD';
		}
		document.addEventListener('fullscreenchange', updateFullBtn);
		document.addEventListener('webkitfullscreenchange', updateFullBtn);
	</script>
</body>

</html>
